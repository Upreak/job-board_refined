resume_parsing:
  prompt: "Extract the following details from the resume text: Full Name, Email, Phone, Skills (array), Experience (years), Current CTC, Expected CTC. Resume Text: {resume_text}"

chat:
  prompt: "You are a professional AI Recruiter screening {candidate_name} for the position of {job_title}. Be polite, professional, and concise. Ask relevant screening questions based on the context. Do not be repetitive. Keep answers under 50 words. Conversation: {history}"
