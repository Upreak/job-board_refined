# Enhanced Configuration for Key Manager + Model Fallback System
# This configuration supports multiple API keys per provider and model fallback

# Global Configuration
global:
  # Logging configuration
  logging:
    level: INFO
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    file: "logs/brain_module.log"
  
  # Performance settings
  performance:
    timeout: 30  # seconds
    retry_attempts: 3
    retry_delay: 1  # seconds
    max_concurrent_requests: 5
  
  # Fallback settings
  fallback:
    enable_auto_fallback: true
    max_fallback_attempts: 5
    fallback_delay: 2  # seconds
    health_check_interval: 300  # seconds (5 minutes)
  
  # Output settings
  output:
    save_responses: true
    output_directory: "PR"
    temp_directory: "tmp"
    cleanup_temp_files: true
    temp_file_age_hours: 24

# Provider Configuration
providers:
  # OpenRouter Provider Configuration
  openrouter:
    name: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    description: "Primary LLM provider with multiple API key support"
    
    # API Keys Configuration (supports multiple keys for rotation)
    api_keys:
      - key_env: "OPENROUTER_API_KEY"
        name: "primary_key"
        priority: 1
        daily_limit: 1000
        usage_reset_hour: 0  # UTC
        enabled: true
    
    # Working OpenRouter Models (Tested and Verified)
    models:
      - name: "z-ai/glm-4.5-air:free"
        priority: 1
        max_tokens: 4000
        temperature: 0.7
        enabled: true
        daily_limit: 500
        description: "Primary model - GLM 4.5 Air free tier - TESTED ✓"
      - name: "x-ai/grok-4.1-fast:free"
        priority: 2
        max_tokens: 4000
        temperature: 0.7
        enabled: true
        daily_limit: 500
        description: "Fast Grok model - free tier - TESTED ✓"
      - name: "moonshotai/kimi-k2:free"
        priority: 3
        max_tokens: 4000
        temperature: 0.7
        enabled: true
        daily_limit: 300
        description: "Moonshot AI Kimi model - free tier - TESTED ✓"
      - name: "openai/gpt-5-nano"
        priority: 4
        max_tokens: 4000
        temperature: 0.7
        enabled: true
        daily_limit: 200
        description: "OpenAI GPT-5 Nano - TESTED ✓"
      - name: "google/gemini-2.0-flash-exp:free"
        priority: 5
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 400
        description: "Google Gemini 2.0 Flash Exp - TESTED ✓"
    
    # Provider-specific settings
    settings:
      request_timeout: 30
      retry_attempts: 3
      health_check_endpoint: "/health"
      rate_limit_delay: 1  # seconds between requests

  # Gemini Provider Configuration
  gemini:
    name: "Google Gemini"
    base_url: null  # Modern Gemini API doesn't require a specific base URL
    description: "Google's Gemini AI with multiple API key support"
    
    # API Keys Configuration
    api_keys:
      - key_env: "GEMINI_API_KEY"
        name: "primary_key"
        priority: 1
        daily_limit: 1500
        usage_reset_hour: 0
        enabled: true
    
    # Updated Gemini Models (Working + new models)
    models:
      - name: "gemini-2.0-flash-lite-001"
        priority: 1
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 500
        description: "Google Gemini 2.0 Flash Lite - tested and working"
      - name: "gemini-3-pro-preview"
        priority: 2
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 400
        description: "Google Gemini 3 Pro Preview - new model"
      - name: "gemini-2.5-flash-lite"
        priority: 3
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 400
        description: "Google Gemini 2.5 Flash Lite - new model"
      - name: "gemini-2.0-flash-lite"
        priority: 4
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 400
        description: "Google Gemini 2.0 Flash Lite - variant"
    
    # Provider-specific settings
    settings:
      request_timeout: 30
      retry_attempts: 3
      health_check_endpoint: "/models"
      rate_limit_delay: 1

  # Groq Provider Configuration
  groq:
    name: "Groq"
    base_url: "https://api.groq.com/openai/v1"
    description: "Groq's fast LLM inference with multiple API key support"
    
    # API Keys Configuration
    api_keys:
      - key_env: "GROQ_API_KEY"
        name: "primary_key"
        priority: 1
        daily_limit: 2000
        usage_reset_hour: 0
        enabled: true
    
    # Model Configuration with Fallback (Working + new models)
    models:
      - name: "llama-3.1-8b-instant"
        priority: 1
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 500
        description: "Working Llama model - fast inference"
      - name: "grok-4-1-fast-reasoning"
        priority: 2
        max_tokens: 8192
        temperature: 0.7
        enabled: true
        daily_limit: 400
        description: "Grok 4.1 Fast Reasoning - new model"
    
    # Provider-specific settings
    settings:
      request_timeout: 15  # Groq is typically faster
      retry_attempts: 3
      health_check_endpoint: "/models"
      rate_limit_delay: 0.5  # Groq has higher rate limits

# Task-specific Configuration
tasks:
  chat:
    description: "General chat conversation"
    input_type: "text"
    output_format: "text"
    default_provider: "openrouter"
    default_model: "z-ai/glm-4.5-air:free"
    fallback_providers: ["gemini", "groq"]
    max_tokens: 4000
    temperature: 0.7
  
  resume_parsing:
    description: "Parse and analyze resume documents"
    input_type: "file"
    output_format: "JSON"
    default_provider: "openrouter"
    default_model: "x-ai/grok-4.1-fast:free"
    fallback_providers: ["gemini", "groq"]
    max_tokens: 8000
    temperature: 0.3
  
  jd_parsing:
    description: "Parse and analyze job descriptions"
    input_type: "file"
    output_format: "JSON"
    default_provider: "openrouter"
    default_model: "x-ai/grok-4.1-fast:free"
    fallback_providers: ["gemini", "groq"]
    max_tokens: 8000
    temperature: 0.3
  
  generic:
    description: "Generic text analysis and response"
    input_type: "text"
    output_format: "text"
    default_provider: "openrouter"
    default_model: "z-ai/glm-4.5-air:free"
    fallback_providers: ["gemini", "groq"]
    max_tokens: 4000
    temperature: 0.7

# Provider fallback order for the system
fallback:
  provider_fallback_order: ["openrouter", "gemini", "groq"]

# Text Extraction Configuration
text_extraction:
  mode: "local"  # "local" or "api"
  strategy: "fast"  # "fast", "ocr_only", or "hi_res"
  
  # Local processing settings
  local:
    preserve_layout:
      headers: true
      lists: true
      tables: true
    output:
      include_element_types: false
      join_with_blank_lines: true
  
  # API processing settings
  api:
    url: "https://api.unstructured.io/general/v0/general"
    api_key_env: "UNSTRUCTURED_API_KEY"
    strategy: "hi_res"
  
  # Supported file types
  supported_formats:
    - ".pdf"
    - ".docx"
    - ".doc"
    - ".txt"

# Monitoring and Analytics
monitoring:
  enable_metrics: true
  metrics_interval: 60  # seconds
  export_metrics: true
  metrics_file: "logs/metrics.json"
  
  # Alert thresholds
  alerts:
    failure_rate_threshold: 0.1  # 10%
    response_time_threshold: 30  # seconds
    error_rate_threshold: 0.05  # 5%